<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">6502 Emulator Support Matrix</title>
  <desc id="desc">Static portfolio matrix showing support percentage and hardware closeness for major emulator areas.</desc>
  <defs>
    <style>
      .bg { fill: #0f1322; }
      .panel { fill: #151c31; stroke: #2c365a; stroke-width: 1; }
      .text { fill: #e9eefc; font-family: "Monaspace Krypton", "SFMono-Regular", Consolas, monospace; font-size: 18px; }
      .head { fill: #ffffff; font-family: "Monaspace Krypton", "SFMono-Regular", Consolas, monospace; font-size: 28px; font-weight: 700; }
      .sub { fill: #b8c5ea; font-family: "Monaspace Krypton", "SFMono-Regular", Consolas, monospace; font-size: 16px; }
      .muted { fill: #9caad1; font-family: "Monaspace Krypton", "SFMono-Regular", Consolas, monospace; font-size: 15px; }
      .bar-bg { fill: #283250; }
      .bar-support { fill: #33c1ff; }
      .bar-hw { fill: #8be08b; }
      .grid { stroke: #2f3b63; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="760"/>
  <rect class="panel" x="36" y="34" width="1208" height="692" rx="14"/>

  <text class="head" x="64" y="88">6502 Emulator Support Matrix</text>
  <text class="sub" x="64" y="118">Static snapshot for README and CV portfolio (not runtime UI).</text>

  <text class="text" x="64" y="168">Area</text>
  <text class="text" x="548" y="168">Support</text>
  <text class="text" x="812" y="168">Hardware Closeness</text>
  <text class="text" x="1060" y="168">Notes</text>

  <line class="grid" x1="52" y1="186" x2="1228" y2="186"/>

  <!-- Row 1 -->
  <text class="text" x="64" y="226">Official opcode decode/execute</text>
  <rect class="bar-bg" x="548" y="206" width="220" height="24" rx="5"/>
  <rect class="bar-support" x="548" y="206" width="220" height="24" rx="5"/>
  <text class="sub" x="776" y="224">100%</text>
  <rect class="bar-bg" x="812" y="206" width="220" height="24" rx="5"/>
  <rect class="bar-hw" x="812" y="206" width="220" height="24" rx="5"/>
  <text class="sub" x="1040" y="224">100%</text>
  <text class="muted" x="1060" y="226">All 151 documented opcodes mapped.</text>

  <!-- Row 2 -->
  <text class="text" x="64" y="280">Addressing modes</text>
  <rect class="bar-bg" x="548" y="260" width="220" height="24" rx="5"/>
  <rect class="bar-support" x="548" y="260" width="220" height="24" rx="5"/>
  <text class="sub" x="776" y="278">100%</text>
  <rect class="bar-bg" x="812" y="260" width="220" height="24" rx="5"/>
  <rect class="bar-hw" x="812" y="260" width="220" height="24" rx="5"/>
  <text class="sub" x="1040" y="278">100%</text>
  <text class="muted" x="1060" y="280">Immediate, zp, abs, indirect, relative.</text>

  <!-- Row 3 -->
  <text class="text" x="64" y="334">Decimal mode arithmetic (ADC/SBC)</text>
  <rect class="bar-bg" x="548" y="314" width="220" height="24" rx="5"/>
  <rect class="bar-support" x="548" y="314" width="220" height="24" rx="5"/>
  <text class="sub" x="776" y="332">100%</text>
  <rect class="bar-bg" x="812" y="314" width="220" height="24" rx="5"/>
  <rect class="bar-hw" x="812" y="314" width="198" height="24" rx="5"/>
  <text class="sub" x="1040" y="332">90%</text>
  <text class="muted" x="1060" y="334">BCD paths implemented and tested.</text>

  <!-- Row 4 -->
  <text class="text" x="64" y="388">Interrupt vectors (IRQ/NMI/BRK)</text>
  <rect class="bar-bg" x="548" y="368" width="220" height="24" rx="5"/>
  <rect class="bar-support" x="548" y="368" width="220" height="24" rx="5"/>
  <text class="sub" x="776" y="386">100%</text>
  <rect class="bar-bg" x="812" y="368" width="220" height="24" rx="5"/>
  <rect class="bar-hw" x="812" y="368" width="187" height="24" rx="5"/>
  <text class="sub" x="1040" y="386">85%</text>
  <text class="muted" x="1060" y="388">Instruction-boundary accurate.</text>

  <!-- Row 5 -->
  <text class="text" x="64" y="442">JMP indirect page-wrap quirk</text>
  <rect class="bar-bg" x="548" y="422" width="220" height="24" rx="5"/>
  <rect class="bar-support" x="548" y="422" width="220" height="24" rx="5"/>
  <text class="sub" x="776" y="440">100%</text>
  <rect class="bar-bg" x="812" y="422" width="220" height="24" rx="5"/>
  <rect class="bar-hw" x="812" y="422" width="220" height="24" rx="5"/>
  <text class="sub" x="1040" y="440">100%</text>
  <text class="muted" x="1060" y="442">6502 compatibility toggle enabled.</text>

  <!-- Row 6 -->
  <text class="text" x="64" y="496">Cycle-level timing fidelity</text>
  <rect class="bar-bg" x="548" y="476" width="220" height="24" rx="5"/>
  <rect class="bar-support" x="548" y="476" width="77" height="24" rx="5"/>
  <text class="sub" x="776" y="494">35%</text>
  <rect class="bar-bg" x="812" y="476" width="220" height="24" rx="5"/>
  <rect class="bar-hw" x="812" y="476" width="77" height="24" rx="5"/>
  <text class="sub" x="1040" y="494">35%</text>
  <text class="muted" x="1060" y="496">Cycle-accurate bus timing is pending.</text>

  <!-- Row 7 -->
  <text class="text" x="64" y="550">Unofficial opcode support</text>
  <rect class="bar-bg" x="548" y="530" width="220" height="24" rx="5"/>
  <rect class="bar-support" x="548" y="530" width="0" height="24" rx="5"/>
  <text class="sub" x="776" y="548">0%</text>
  <rect class="bar-bg" x="812" y="530" width="220" height="24" rx="5"/>
  <rect class="bar-hw" x="812" y="530" width="0" height="24" rx="5"/>
  <text class="sub" x="1040" y="548">0%</text>
  <text class="muted" x="1060" y="550">Undocumented opcodes intentionally omitted.</text>

  <line class="grid" x1="52" y1="588" x2="1228" y2="588"/>

  <rect class="bar-support" x="64" y="616" width="18" height="18" rx="4"/>
  <text class="sub" x="90" y="631">Support (feature completeness)</text>
  <rect class="bar-hw" x="360" y="616" width="18" height="18" rx="4"/>
  <text class="sub" x="386" y="631">Hardware closeness (behavior fidelity)</text>
  <text class="muted" x="64" y="668">Source basis: instruction table + execution model in /src/6502/6502.hpp, status as of Feb 19, 2026.</text>
</svg>
